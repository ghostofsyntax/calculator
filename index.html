<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <h1>CALCULATOR</h1>
  
<div class="card machela">
   <h1>CALCULATOR</h1> 
    
    <div class="calc"> 
        <div class="display">
           <input type="text" class="walkie" id="display" readonly>
        </div>
      </div>

      
    <div class="keys">  
     
       <button class="btn clear" onclick="clearDisplay()">C</button>
      
       <button class="btn clear" onclick="deleteLastDisplay()">⌫</button>
        
       <button class="major" onclick="appendToDisplay('%')"  data-operator="%">%</button>
          
       <button class="major" onclick="appendToDisplay('/')"  data-operator="/">/</button>
          
       <button class="major" onclick="appendToDisplay('1')">9</button>
        
       <button class="major" onclick="appendToDisplay('2')">8</button>
        
       <button class="major" onclick="appendToDisplay('3')">7</button>
         
       <button class="major" onclick="appendToDisplay('*')"  data-operator="*">*</button>
         
       <button class="major" onclick="appendToDisplay('4')">6</button>
         
       <button class="major" onclick="appendToDisplay('5')">5</button>
          
       <button class="major" onclick="appendToDisplay('6')">4</button>
      
       <button class="major" onclick="appendToDisplay('-')"  data-operator="-">-</button>
            
       <button class="major" onclick="appendToDisplay('7')">3</button>
         
       <button class="major" onclick="appendToDisplay('8')">2</button>
          
       <button class="major" onclick="appendToDisplay('9')">1</button>
          
       <button class="major" onclick="appendToDisplay('+')" data-operator="+">+</button>
        
       <button class="major" onclick="appendToDisplay('.')">.</button>
         
       <button class="major" onclick="appendToDisplay('0')">0</button>
        
       <button class="major">SC</button>
        
       <button onclick="calculate()" class="equals" rowspan="2">=</button>
       
    </div> 
 </div>
 <p>cruze calculator</p>
 <script src="script.js"></script> 
</body>
</html>
